<script type="module">
import * as THREE from 'three';

// ── Renderer / scene ──────────────────────────────────────

// ── Procedural textures ───────────────────────────────────
let seed = 3;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  t.userData.size = [rx, ry];
  return t;
}
function grain(g, w, h, dark, n, alpha) {
  for (let i = 0; i < n; i++) {
    const y = rand() * h, amp = 2 + rand() * 6, f = 0.004 + rand() * 0.01;
    g.strokeStyle = `rgba(${dark},${alpha * (0.4 + rand())})`; g.lineWidth = 0.6 + rand() * 1.6;
    g.beginPath();
    for (let x = 0; x <= w; x += 8) g.lineTo(x, y + Math.sin(x * f + i) * amp);
    g.stroke();
  }
}
const woodFill = (base, dark) => (g, w, h) => { g.fillStyle = base; g.fillRect(0, 0, w, h); grain(g, w, h, dark, 160, 0.10); };
const TEX = {
  // grey-oak laminate as in the listing: 1.2 m x 0.2 m boards, 2.4 m tile
  wood: canvasTex(1024, 1024, (g, w, h) => {
    const rows = 12, rh = h / rows;
    for (let r = 0; r < rows; r++) {
      const off = (r % 3) * w / 3;
      for (let k = -1; k < 2; k++) {
        const v = 170 + rand() * 24 | 0, x0 = off + k * w / 2;
        g.fillStyle = `rgb(${v},${v - 10},${v - 24})`; g.fillRect(x0, r * rh, w / 2, rh);
        g.save(); g.beginPath(); g.rect(x0, r * rh, w / 2, rh); g.clip();
        for (let s = 0; s < 14; s++) {
          const y = r * rh + rand() * rh;
          g.strokeStyle = `rgba(95,72,50,${0.05 + rand() * 0.08})`; g.lineWidth = 0.8 + rand() * 1.5;
          g.beginPath(); for (let x = x0; x <= x0 + w / 2; x += 10) g.lineTo(x, y + Math.sin(x * 0.02 + s) * 2.5); g.stroke();
        }
        g.restore();
        g.fillStyle = 'rgba(60,50,40,0.35)'; g.fillRect(x0, r * rh, 2, rh);
      }
      g.fillStyle = 'rgba(60,50,40,0.35)'; g.fillRect(0, r * rh, w, 2);
    }
  }, 2.4, 2.4),
  // 60 x 120 cm grey porcelain (corridor, kitchen)
  tile: canvasTex(512, 512, (g, w, h) => {
    for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) {
      const v = 178 + rand() * 10 | 0;
      g.fillStyle = `rgb(${v},${v + 1},${v - 1})`; g.fillRect(i * w / 4, j * h / 2, w / 4, h / 2);
      for (let s = 0; s < 300; s++) { g.fillStyle = `rgba(120,120,118,${rand() * 0.12})`; g.fillRect(i * w / 4 + rand() * w / 4, j * h / 2 + rand() * h / 2, 2, 2); }
    }
    g.strokeStyle = 'rgba(232,232,228,0.95)'; g.lineWidth = 3;
    for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.stroke(); }
    for (let j = 0; j <= 2; j++) { g.beginPath(); g.moveTo(0, j * h / 2); g.lineTo(w, j * h / 2); g.stroke(); }
  }, 2.4, 2.4),
  bath: canvasTex(512, 512, (g, w, h) => {
    for (let i = 0; i < 2; i++) for (let j = 0; j < 4; j++) {
      const v = 82 + rand() * 10 | 0;
      g.fillStyle = `rgb(${v},${v + 2},${v + 4})`; g.fillRect(i * w / 2, j * h / 4, w / 2, h / 4);
    }
    g.strokeStyle = '#4a4c4e'; g.lineWidth = 3;
    for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * w / 2, 0); g.lineTo(i * w / 2, h); g.stroke(); }
    for (let j = 0; j <= 4; j++) { g.beginPath(); g.moveTo(0, j * h / 4); g.lineTo(w, j * h / 4); g.stroke(); }
  }, 2.4, 2.4),
  marble: canvasTex(1024, 1024, (g, w, h) => {
    g.fillStyle = '#f1f0ec'; g.fillRect(0, 0, w, h);
    for (let v = 0; v < 18; v++) {
      let x = rand() * w, y = rand() * h, a = rand() * Math.PI * 2;
      g.strokeStyle = `rgba(110,110,115,${0.12 + rand() * 0.22})`; g.lineWidth = 0.6 + rand() * 2.4;
      g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < 70; s++) { a += (rand() - 0.5) * 0.6; x += Math.cos(a) * 14; y += Math.sin(a) * 14; g.lineTo(x, y); }
      g.stroke();
    }
  }, 1.2, 1.2),
  marbleTile: canvasTex(1024, 1024, (g, w, h) => {
    g.fillStyle = '#efeeea'; g.fillRect(0, 0, w, h);
    for (let v = 0; v < 22; v++) {
      let x = rand() * w, y = rand() * h, a = rand() * Math.PI * 2;
      g.strokeStyle = `rgba(120,118,112,${0.1 + rand() * 0.2})`; g.lineWidth = 0.6 + rand() * 2;
      g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < 60; s++) { a += (rand() - 0.5) * 0.5; x += Math.cos(a) * 14; y += Math.sin(a) * 14; g.lineTo(x, y); }
      g.stroke();
    }
    g.strokeStyle = 'rgba(200,198,192,0.9)'; g.lineWidth = 2;
    for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * w / 2, 0); g.lineTo(i * w / 2, h); g.stroke(); }
    g.beginPath(); g.moveTo(0, h); g.lineTo(w, h); g.stroke(); g.beginPath(); g.moveTo(0, 0); g.lineTo(w, 0); g.stroke();
  }, 1.2, 1.2),
  zellige: canvasTex(512, 512, (g, w, h) => {
    const n = 8, s = w / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const v = 236 + rand() * 14 | 0;
      g.fillStyle = `rgb(${v - 6},${v},${v - 2})`; g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(i * s + 6, j * s + 6, s * 0.4, s * 0.15);
    }
  }, 0.8, 0.8),
  walnut: canvasTex(512, 512, woodFill('#6a4831', '45,28,16'), 1, 1),
  oak: canvasTex(512, 512, woodFill('#c8a77e', '120,85,50'), 1, 1),
  grass: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#6a9a45'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(${40 + rand() * 60 | 0},${100 + rand() * 60 | 0},40,0.5)`; g.fillRect(rand() * w, rand() * h, 1.5, 3); }
  }, 2, 2),
  deck: canvasTex(512, 512, (g, w, h) => {
    for (let i = 0; i < 8; i++) { const v = 150 + rand() * 25 | 0; g.fillStyle = `rgb(${v},${v - 30},${v - 60})`; g.fillRect(0, i * h / 8, w, h / 8 - 4); }
    grain(g, w, h, '70,40,20', 90, 0.12);
  }, 2.4, 2.4),
  rug: canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#e7dfd1'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${150 + rand() * 60 | 0},${140 + rand() * 50 | 0},120,0.25)`; g.fillRect(rand() * w, rand() * h, 2, 2); }
    g.strokeStyle = 'rgba(80,70,60,0.35)'; g.lineWidth = 3;
    for (let k = -8; k < 16; k++) { g.beginPath(); g.moveTo(k * 64, 0); g.lineTo(k * 64 + 256, h / 2); g.lineTo(k * 64, h); g.stroke(); }
  }, 1.6, 1.6),
};
function fabricTex(color) {
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = color; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 7000; i++) { const v = rand() < 0.5 ? 0 : 255; g.fillStyle = `rgba(${v},${v},${v},${0.04 + rand() * 0.05})`; g.fillRect(rand() * w, rand() * h, 1.5, 1.5); }
  }, 0.5, 0.5);
}
function texMat(name, sx, sz, extra = {}) {
  const t = TEX[name].clone();
  t.repeat.set(sx / t.userData.size[0], sz / t.userData.size[1]);
  t.needsUpdate = true;
  return new THREE.MeshStandardMaterial({ map: t, roughness: 0.8, ...extra });
}
const std = (o) => new THREE.MeshStandardMaterial(o);
const M = {
  wall: std({ color: 0xf2efe9, roughness: 0.95 }),
  ext: std({ color: 0xeeebe4, roughness: 0.95 }),
  white: std({ color: 0xf7f7f5, roughness: 0.5 }),
  doorLeaf: std({ color: 0xf1ede2, roughness: 0.45 }),
  steel: std({ color: 0x3c4147, roughness: 0.4, metalness: 0.5 }),
  chrome: std({ color: 0xd6d9dc, roughness: 0.15, metalness: 1 }),
  black: std({ color: 0x1d1e20, roughness: 0.45, metalness: 0.4 }),
  brass: std({ color: 0xc9a25a, roughness: 0.3, metalness: 1 }),
  glass: std({ color: 0xa9c9dc, transparent: true, opacity: 0.18, roughness: 0.05, metalness: 0.2, depthWrite: false }),
  frame: std({ color: 0xfafafa, roughness: 0.35 }),
  ceiling: std({ color: 0xfbfaf7, emissive: 0x5e5b55, roughness: 1, side: THREE.DoubleSide }),
  walnut: std({ map: TEX.walnut, roughness: 0.55 }),
  oak: std({ map: TEX.oak, roughness: 0.6 }),
  marble: std({ map: TEX.marble, roughness: 0.18 }),
  porcelain: std({ color: 0xfdfdfb, roughness: 0.12 }),
  sofa: std({ map: fabricTex('#9ea19d'), roughness: 1 }),
  linen: std({ map: fabricTex('#f3efe7'), roughness: 1 }),
  beige: std({ map: fabricTex('#cdbba0'), roughness: 1 }),
  terracotta: std({ map: fabricTex('#c4704a'), roughness: 1 }),
  mustard: std({ map: fabricTex('#d9a441'), roughness: 1 }),
  sage: std({ map: fabricTex('#8fa38a'), roughness: 1 }),
  navy: std({ map: fabricTex('#3c4a63'), roughness: 1 }),
  cabinet: std({ color: 0x84957f, roughness: 0.6 }),
  curtain: std({ color: 0xf5f2ea, roughness: 1, transparent: true, opacity: 0.88, side: THREE.DoubleSide }),
  leaf: std({ color: 0x3e6b2f, roughness: 0.7, side: THREE.DoubleSide }),
  leaf2: std({ color: 0x55823b, roughness: 0.7, side: THREE.DoubleSide }),
  pot: std({ color: 0xe8e2d6, roughness: 0.8 }),
  potT: std({ color: 0xb8673f, roughness: 0.9 }),
  rug: std({ map: TEX.rug, roughness: 1 }),
  lampShade: std({ color: 0xfff3dc, emissive: 0xffc98a, emissiveIntensity: 0.9, roughness: 1, side: THREE.DoubleSide }),
};

function box(w, h, d, x, y, z, mat, parent = root, cast = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof mat === 'number' ? std({ color: mat, roughness: 0.8 }) : mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = cast; m.receiveShadow = true;
  parent.add(m);
  return m;
}

// ── Walls with openings ───────────────────────────────────
// axis 'x': runs along x at z = at;  axis 'z': runs along z at x = at
const openings = [];
function wall(axis, at, a0, a1, t, ops = [], mat = M.wall) {
  const seg = (p0, p1, y0, y1) => {
    if (p1 - p0 < 0.005 || y1 - y0 < 0.005) return;
    const len = p1 - p0, mid = (p0 + p1) / 2;
    if (axis === 'x') box(len, y1 - y0, t, mid, y0, at, mat);
    else box(t, y1 - y0, len, at, y0, mid, mat);
    if (y0 === 0) {
      if (axis === 'x') box(len, 0.09, t + 0.024, mid, 0, at, M.white, root, false);
      else box(t + 0.024, 0.09, len, at, 0, mid, M.white, root, false);
    }
  };
  let cur = a0;
  for (const o of [...ops].sort((p, q) => p.from - q.from)) {
    seg(cur, o.from, 0, H);
    seg(o.from, o.to, 0, o.bottom || 0);
    seg(o.from, o.to, o.top, H);
    cur = o.to;
    openings.push({ ...o, axis, at, t });
  }
  seg(cur, a1, 0, H);
}
const door = (from, to, swing, opts = {}) => ({ kind: 'door', from, to, bottom: 0, top: 2.1, swing, ...opts });
const win = (from, to, bottom = 0.9, top = 2.3) => ({ kind: 'window', from, to, bottom, top });

wall('x', 0, -EXT / 2, W + EXT / 2, EXT, [door(4.75, 5.65, 1, { entrance: true }), win(7.9, 9.7, 1.05, 2.2)], M.ext);
wall('x', D, -EXT / 2, W + EXT / 2, EXT, [win(1.4, 3.9), { kind: 'slide', from: 6.4, to: 9.6, bottom: 0, top: 2.35 }], M.ext);
wall('z', 0, 0, D, EXT, [win(0.9, 2.5), win(4.2, 5.0, 1.6, 2.2)], M.ext);
wall('z', W, 0, D, EXT, [win(3.9, 5.4), win(1.2, 2.2, 1.05, 2.2)], M.ext);
wall('z', 4.6, 0, 5.8, INT, [door(2.25, 3.1, -1), door(4.5, 5.3, -1)]);
wall('x', 3.4, 0, 4.6, INT);
wall('x', 5.8, 0, 5.8, INT, [door(4.75, 5.6, 1)]);
wall('z', 5.8, 0, 5.8, INT, [door(1.2, 2.05, 1), { kind: 'arch', from: 3.9, to: 5.45, bottom: 0, top: 2.35 }]);
wall('x', 3.4, 5.8, W, INT);
wall('z', 5.8, 5.8, D, INT);

for (const o of openings) {
  const len = o.to - o.from;
  if (o.kind === 'door') {
    const pivot = new THREE.Group();
    if (o.axis === 'x') pivot.position.set(o.from + 0.02, 0, o.at);
    else pivot.position.set(o.at, 0, o.from + 0.02);
    const open = o.entrance ? 0.25 : 1.15;
    pivot.rotation.y = o.axis === 'x' ? -o.swing * open : o.swing * open;
    root.add(pivot);

const toWorld = (p) => new THREE.Vector3(p[0] - W / 2, p[1], p[2] - D / 2);

};
for (const r of ROOMS) VIEWS[r.id] = { pos: toWorld(r.eye), target: toWorld(r.look), inside: true, eye: true };
function applyMode(v) { ceilings.visible = v.inside; labels.visible = !v.eye; }

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (composer) { composer.setSize(window.innerWidth, window.innerHeight); }
});

if (RENDER) {
  document.getElementById('loading').remove();
  window.showView = (id, furnished = true) => {
    const v = VIEWS[id];
    furn.visible = furnished;
    applyMode(v);
    camera.position.copy(v.pos); camera.lookAt(v.target);
    draw();
  };
  window.READY = true;
} else {
  document.getElementById('loading').remove();
  document.getElementById('info').hidden = false;
  document.getElementById('bar').hidden = false;
  const net = ROOMS.reduce((s, r) => s + area(r), 0);
  document.getElementById('meta').textContent = `Yaklaşık ${net.toFixed(0)} m² · 2 oda + salon · bahçe kullanımlı. Plan ve dekorasyon temsilidir.`;

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  let fly = null;
  function setControls(v) {
    if (v.eye) {
      const dir = v.target.clone().sub(v.pos).normalize();
      controls.target.copy(v.pos).addScaledVector(dir, 0.05);
      controls.minDistance = controls.maxDistance = 0.05;
      controls.enableZoom = controls.enablePan = false;
      controls.rotateSpeed = -0.35;
      controls.minPolarAngle = 0.35; controls.maxPolarAngle = Math.PI - 0.35;
    } else {
      controls.target.copy(v.target);
      controls.minDistance = 5; controls.maxDistance = 32;
      controls.enableZoom = controls.enablePan = true;
      controls.rotateSpeed = 1;
      controls.minPolarAngle = 0; controls.maxPolarAngle = 1.35;
    }
  }
  function go(id) {
    const v = VIEWS[id];
    document.querySelectorAll('#rooms button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
    document.getElementById('hint').textContent = v.eye ? 'Sürükleyerek etrafa bak' : 'Sürükleyerek döndür · iki parmakla yakınlaştır';
    const lookFrom = camera.position.clone().add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(4));
    fly = { t0: performance.now(), from: camera.position.clone(), fromT: lookFrom, v, dur: reduceMotion ? 1 : 1400, switched: false };
    controls.enabled = false;
  }
  const bar = document.getElementById('rooms');
  for (const [id, name] of [['plan', 'Kuşbakışı'], ['salon', 'Salon'], ['mutfak', 'Mutfak'], ['yatak', 'Yatak odası'], ['cocuk', 'Çocuk odası'], ['banyo', 'Banyo'], ['antre', 'Antre'], ['bahce', 'Bahçe']]) {
    const b = document.createElement('button');
    b.textContent = name; b.dataset.id = id; b.type = 'button';
    b.onclick = () => go(id);
    bar.appendChild(b);
  }
  document.getElementById('furn').onchange = (e) => { furn.visible = e.target.checked; };

  camera.position.copy(VIEWS.plan.pos);
  setControls(VIEWS.plan); applyMode(VIEWS.plan);
  document.querySelector('#rooms button').setAttribute('aria-pressed', 'true');

  const ease = (x) => x * x * (3 - 2 * x);
  renderer.setAnimationLoop(() => {
    if (fly) {
      const k = Math.min(1, (performance.now() - fly.t0) / fly.dur), e = ease(k);
      const lift = Math.sin(e * Math.PI) * (fly.v.eye ? 3.2 : 0);
      camera.position.lerpVectors(fly.from, fly.v.pos, e); camera.position.y += lift;
      camera.lookAt(new THREE.Vector3().lerpVectors(fly.fromT, fly.v.target, e));
      if (!fly.switched && e > 0.55) { applyMode(fly.v); fly.switched = true; }
      if (k >= 1) { applyMode(fly.v); setControls(fly.v); camera.position.copy(fly.v.pos); controls.update(); controls.enabled = true; fly = null; }
    } else {
      controls.update();
    }
    draw();
  });
}
